# Build, test and lint every push to main and every pull request.
# Actions are pinned to full commit SHAs; Dependabot proposes updates
# (.github/dependabot.yml). The Rust toolchain comes from the rustup that
# GitHub's runner images ship, so no third-party action is involved.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Each push to main gets
# its own group and runs to completion, so no pushed commit goes unchecked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test-output.txt
      - name: Surface failing tests
        if: failure()
        run: |
          grep -E '^test .* FAILED|panicked at' test-output.txt | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done

  lint:
    name: Lint (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
          rustc --version
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
