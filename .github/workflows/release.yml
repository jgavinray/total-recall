# Release management with release-please (docs/release-management-spec.md).
#
# Model: once a version is pinned, release-please opens one standing release
# PR for that version and keeps it up to date as further work lands on main —
# the PR is the tag's staging area (changelog + Cargo.toml + Cargo.lock).
# Merging it bumps the version, tags vX.Y.Z, and publishes the GitHub release.
#
# Pinning a version, either way lands a `Release-As: x.y.z` commit on main,
# which release-please reads on every run — so the pin survives later pushes:
#   - Actions → Release → Run workflow, `version` = e.g. 0.2.0 (this workflow
#     creates the empty commit for you), or
#   - `git commit --allow-empty -m "chore: release 0.2.0" -m "Release-As: 0.2.0"`
#
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings → Actions → General → Workflow permissions).
# With the built-in token, CI does not run on the release PR itself; CI still
# runs on main after the merge.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin for the next release (e.g. 0.2.0). Leave empty to just refresh the release PR."
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Pin the version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::version '$VERSION' is not a semver version"; exit 1; }
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: release $VERSION" -m "Release-As: $VERSION"
          git push origin HEAD:main
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
