# Manual release: you trigger it, you see the notes, you publish.
#
# Run: Actions → Release → Run workflow.
#   version  e.g. 0.2.0 — must match Cargo.toml (bump it, and Cargo.lock, in a
#            pull request first; CI's --locked enforces the lock sync).
#   notes    optional markdown; empty builds them from the CHANGELOG.md
#            section for that version, else from the commits since the last tag.
#   publish  unchecked = dry run: builds and shows the notes in the run
#            summary, tags nothing. Check it to tag v<version> at the run's
#            commit and create the GitHub release with those notes.
#
# No pull request is created and no third-party release tool is involved, so
# this needs nothing beyond the built-in token's `contents: write` — in
# particular, the repository setting "Allow GitHub Actions to create and
# approve pull requests" is irrelevant here.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0) — must match Cargo.toml; becomes tag v<version>"
        required: true
        type: string
      notes:
        description: "Release notes (markdown). Leave empty to build them from CHANGELOG.md or the commits since the last tag."
        required: false
        type: string
      publish:
        description: "Publish: tag and create the GitHub release. Leave unchecked for a dry run that only shows the notes."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$' \
            || { echo "::error::'$VERSION' is not a semver version"; exit 1; }
          cargo_version=$(awk '/^\[package\]/{f=1} f && /^version = /{print; exit}' Cargo.toml \
              | sed -E 's/version = "(.*)"/\1/')
          if [ "$VERSION" != "$cargo_version" ]; then
            echo "::error::Cargo.toml says $cargo_version but the input says $VERSION — bump the version (and Cargo.lock) in a pull request first"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already tagged — pick a new version"
            exit 1
          fi
      - name: Build the release notes
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
          elif [ -f CHANGELOG.md ] && \
               awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' \
                 CHANGELOG.md > notes.md && [ -s notes.md ]; then
            : # the changelog section for this version
          else
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            range=${last_tag:+$last_tag..HEAD}
            {
              echo "## Features"
              git log ${range:-HEAD} --pretty='- %s' --grep='^feat' || true
              echo
              echo "## Bug Fixes"
              git log ${range:-HEAD} --pretty='- %s' --grep='^fix' || true
              echo
              echo "## Other Changes"
              git log ${range:-HEAD} --pretty='- %s' | grep -Ev '^- (feat|fix)' || true
            } > notes.md
          fi
          {
            echo "### Release notes for v$VERSION (built from: $([ -n "$NOTES" ] && echo input || echo changelog-or-commits))"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "----- notes.md -----"
          cat notes.md
      - name: Tag and publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
