[package]
name = "total-recall"
version = "0.1.1"
edition = "2021"
license = "GPL-2.0"
description = "total-recall — markdown side-band memory enforced over the buckets it owns"

[dependencies]
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "total-recall"
path = "src/main.rs"

[[bin]]
name = "total-recall-mcp"
path = "src/bin/total-recall-mcp.rs"
